# Metadata C gmond 3.7.2 sends for its built-in and Python-module metrics,
# so rgmond can send exactly the same. Extracted from captured gmond traffic
# (tools/extract_spec.py). Names with "{}" are per-device/interface/mount/
# process families: "{}" matches that part, "{name}" expands to the full
# metric name and "{mount}" to the mount point diskfree derives from it.

[[metric]]
name = "boottime"
type = "uint32"
units = "s"
slope = 0
tmax = 1200
dmax = 0
fmt = "%u"
wire = "UInt"
extra = [["TITLE", "Last Boot Time"], ["DESC", "The last time that the system was started"], ["GROUP", "system"]]

